<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板</title>
  
  <style>
    /* ==========================================
       1. 全局變數設定（方便後續修改顏色與風格）
       ========================================== */
    :root {
      /* 【顏色控制區】可自由調整整體配色 */
      --bg-color: #f7f3ef;               /* 網頁背景色（溫暖奶茶色） */
      --card-bg: #ffffff;               /* 卡片背景色 */
      --text-main: #5a504b;             /* 主要文字顏色（柔和深棕灰） */
      --text-sub: #9a8f88;              /* 次要文字/時間顏色（淺灰棕） */
      
      /* 【輪播聚焦效果顏色】 */
      --highlight-border: #e8a598;      /* 焦點卡片邊框顏色（乾燥玫瑰粉） */
      --highlight-glow: rgba(232, 165, 152, 0.45); /* 聚焦卡片的柔和發光暈影 */
      --highlight-scale: 1.05;          /* 聚焦時放大的比例 (1.05 代表放大 5%) */
      
      /* 【非焦點卡片的微暗/模糊特效】 */
      --dim-opacity: 0.55;              /* 未選中卡片的透明度 */
      --dim-blur: 1.5px;                /* 未選中卡片的模糊度 */
      
      /* 【動畫時間設定】 */
      --transition-speed: 0.6s;         /* 卡片切換聚焦時的流暢速度 */
    }

    /* 全局樣式重置 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      color: var(--text-main);
      padding: 2.5rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頁頭標題區 */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 500;
      letter-spacing: 2px;
      color: #4a403a;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    /* ==========================================
       2. 讀取中酷炫動畫 (Loading Animation)
       ========================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 5rem;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(232, 165, 152, 0.2);
      border-top: 3px solid var(--highlight-border);
      border-radius: 50%;
      /* 旋轉動畫與呼吸發光效果 */
      animation: spin 1s linear infinite, pulse 2s ease-in-out infinite;
    }

    .loading-text {
      margin-top: 1.2rem;
      color: var(--text-sub);
      font-size: 1rem;
      letter-spacing: 2px;
      /* 閃爍動畫 */
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 15px rgba(232, 165, 152, 0.2); }
      50% { box-shadow: 0 0 25px rgba(232, 165, 152, 0.6); }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* ==========================================
       3. 瀑布流排版 (Masonry Layout)
       ========================================== */
    .masonry-container {
      width: 100%;
      max-width: 1100px;
      /* 使用 CSS column-count 實現瀑布流高低錯落 */
      column-count: 3;             /* 電腦版預設 3 欄 */
      column-gap: 1.5rem;          /* 欄位間距 */
      display: none;               /* 載入完成前先隱藏 */
    }

    /* 響應式調整：平板 2 欄、手機 1 欄 */
    @media (max-width: 900px) {
      .masonry-container { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-container { column-count: 1; }
    }

    /* ==========================================
       4. 留言卡片與輪播特效樣式
       ========================================== */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      /* 防止卡片在瀑布流中被跨欄截斷 */
      break-inside: avoid;
      
      /* 預設邊框與微柔陰影 */
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 20px rgba(180, 160, 150, 0.08);
      
      /* 動態切換焦點時的平滑轉場 */
      transition: all var(--transition-speed) cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      cursor: pointer;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .card-name {
      font-weight: 600;
      font-size: 1.1rem;
      color: #4a403a;
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .card-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-main);
      white-space: pre-wrap; /* 保留留言換行格式 */
      word-break: break-word;
    }

    /* 焦點卡片樣式：亮起 (Highlight) */
    .card.highlight {
      transform: scale(var(--highlight-scale));
      border-color: var(--highlight-border);
      box-shadow: 0 12px 30px var(--highlight-glow);
      opacity: 1 !important;
      filter: blur(0px) !important;
      z-index: 10;
    }

    /* 非焦點卡片樣式：變暗與模糊 (Dimmed) */
    .card.dimmed {
      opacity: var(--dim-opacity);
      filter: blur(var(--dim-blur));
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <header>
    <h1>溫柔留言牆</h1>
    <p>來自朋友的溫暖鼓勵與悄悄話</p>
  </header>

  <!-- 1. 讀取中動畫區塊 -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 2. 瀑布流留言卡片容器 -->
  <main id="masonry" class="masonry-container"></main>

  <script>
    /* ==========================================
       5. JavaScript 邏輯控制區
       ========================================== */

    // 【設定參數】可在此調整 CSV 網址與輪播秒數
    const CONFIG = {
      // 原試算表網址
      rawUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQVBYtuTKXweyueKDUSDG_ZXPWca_R7i8eI_j2yHyW92i69_74ZobmAI1efVmXuw5wMLq7WNiVxykjp/pubhtml',
      
      // 【輪播時間設定】單位：毫秒 (3000ms = 3 秒)
      carouselInterval: 3000 
    };

    let messages = [];          // 存放解析後的留言資料陣列
    let currentIndex = 0;       // 當前高亮卡片的索引值
    let timer = null;           // 輪播計時器

    // DOM 元素取得
    const loadingEl = document.getElementById('loading');
    const masonryEl = document.getElementById('masonry');

    // 頁面載入後自動開始讀取資料
    fetchMessages();

    /**
     * 從 Google 試算表抓取並解析 CSV 資料
     */
    async function fetchMessages() {
      // 自動將網頁版 pubhtml 網址轉為匯出 CSV 格式
      const csvUrl = CONFIG.rawUrl.replace(/\/pubhtml.*$/, '/pub?output=csv');

      try {
        const response = await fetch(csvUrl);
        if (!response.ok) throw new Error('無法連線至 Google 試算表');
        
        const csvText = await response.text();
        
        // 解析 CSV 並轉換成 JavaScript 陣列
        messages = parseCSV(csvText);

        // 隱藏讀取動畫，顯示留言牆
        loadingEl.style.display = 'none';
        masonryEl.style.display = 'block';

        // 動態生成留言卡片
        renderCards(messages);

        // 啟動自動輪播亮起特效
        if (messages.length > 0) {
          startCarousel();
        }

      } catch (error) {
        console.error('抓取留言資料失敗：', error);
        loadingEl.innerHTML = '<div class="loading-text" style="color: #d97777;">留言載入失敗，請稍後重試。</div>';
      }
    }

    /**
     * CSV 解析器 (能夠精準處理留言內容中含有「逗號」或「雙引號/換行」的情況)
     */
    function parseCSV(text) {
      const result = [];
      let row = [];
      let col = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          // 處理雙引號轉義
          if (inQuotes && nextChar === '"') {
            col += '"';
            i++;
          } else {
            inQuotes = !inQuotes; // 切換引號區域狀態
          }
        } else if (char === ',' && !inQuotes) {
          // 遇到欄位分隔逗號
          row.push(col.trim());
          col = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          // 遇到換行符號
          if (char === '\r' && nextChar === '\n') {
            i++; // 跳過 Windows 的 \r\n
          }
          row.push(col.trim());
          if (row.some(field => field !== '')) {
            result.push(row);
          }
          row = [];
          col = '';
        } else {
          col += char;
        }
      }

      // 處理最後一行的內容
      if (col || row.length > 0) {
        row.push(col.trim());
        if (row.some(field => field !== '')) {
          result.push(row);
        }
      }

      // 剔除第一列（標題列：時間戳記, 名字, 悄悄話）
      const dataRows = result.slice(1);

      // 轉換成物件陣列 [{ time, name, content }, ...]
      return dataRows.map(item => ({
        time: item[0] || '',
        name: item[1] || '無名氏',
        content: item[2] || ''
      })).filter(msg => msg.content !== ''); // 排除空白留言
    }

    /**
     * 將資料動態生成為卡片 DOM 元素
     */
    function renderCards(data) {
      masonryEl.innerHTML = '';

      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = index;

        // 時間格式簡化
        const formattedTime = formatDate(item.time);

        card.innerHTML = `
          <div class="card-header">
            <span class="card-name">${escapeHTML(item.name)}</span>
            <span class="card-time">${formattedTime}</span>
          </div>
          <div class="card-content">${escapeHTML(item.content)}</div>
        `;

        // 滑鼠懸停互動：暫停輪播並直接聚焦於該卡片，離開後恢復自動輪播
        card.addEventListener('mouseenter', () => {
          stopCarousel();
          highlightCard(index);
        });

        card.addEventListener('mouseleave', () => {
          startCarousel();
        });

        masonryEl.appendChild(card);
      });
    }

    /**
     * 設定特定卡片「高亮亮起」，並將其餘卡片「變暗模糊」
     */
    function highlightCard(index) {
      const cards = document.querySelectorAll('.card');
      
      cards.forEach((card, i) => {
        if (i === index) {
          card.classList.add('highlight');
          card.classList.remove('dimmed');
        } else {
          card.classList.remove('highlight');
          card.classList.add('dimmed');
        }
      });

      currentIndex = index;
    }

    /**
     * 啟動自動輪播計時器 (setInterval)
     */
    function startCarousel() {
      stopCarousel(); // 避免重複建立多個計時器
      
      // 立即對當前索引卡片執行高亮
      highlightCard(currentIndex);

      // 每隔指定的秒數切換至下一張卡片
      timer = setInterval(() => {
        currentIndex = (currentIndex + 1) % messages.length; // 陣列循環
        highlightCard(currentIndex);
      }, CONFIG.carouselInterval);
    }

    /**
     * 停止自動輪播計時器
     */
    function stopCarousel() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    /**
     * 日期格式整理（取日期部分）
     */
    function formatDate(timeStr) {
      if (!timeStr) return '';
      return timeStr.split(' ')[0] || timeStr;
    }

    /**
     * XSS 防禦機制（過濾 HTML 特殊符號）
     */
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
