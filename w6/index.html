<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLAYER 1 PORTFOLIO - 電玩闖關作品集</title>

  <style>
    :root {
      --bg-color: #0d0e15;
      --panel-bg: #181a26;
      --border-color: #ffffff;
      --primary-yellow: #f8b800;
      --neon-green: #00ff66;
      --neon-red: #ff3366;
      --neon-blue: #00ccff;
      --neon-purple: #b026ff;
      --text-white: #f0f0f0;
      --font-pixel: 'Press Start 2P', monospace;
    }

    * { box-sizing: border-box; }

    /* ===== MÀN HÌNH 1: ARCADE MENU ===== */
    #arcade-view {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: var(--font-pixel), sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      background-image:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 4px, 6px 100%;
    }

    #arcade-view * { font-family: var(--font-pixel), sans-serif; }

    .pixel-box {
      background-color: var(--panel-bg);
      border: 4px solid var(--border-color);
      box-shadow:
        0 -4px 0 0 var(--border-color),
        0 4px 0 0 var(--border-color),
        -4px 0 0 0 var(--border-color),
        4px 0 0 0 var(--border-color);
      padding: 20px;
      margin-bottom: 20px;
    }

    .game-container { width: 100%; max-width: 900px; }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .player-profile { display: flex; align-items: center; gap: 15px; }

    .avatar {
      width: 48px; height: 48px;
      background: var(--primary-yellow);
      border: 3px solid #fff;
      display: flex; justify-content: center; align-items: center;
      font-size: 24px;
    }

    .status-bars { display: flex; flex-direction: column; gap: 6px; font-size: 10px; }
    .bar-container { width: 150px; height: 14px; background: #333; border: 2px solid #fff; }
    .bar-fill-hp { width: 100%; height: 100%; background: var(--neon-red); }
    .bar-fill-exp { width: 100%; height: 100%; background: var(--neon-blue); }
    .score-board { text-align: right; font-size: 12px; color: var(--primary-yellow); }
