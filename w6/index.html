<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拍照二選一投票器</title>
    <!-- Tailwind CSS 輕量 CDN (透過 CDN 載入) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 隱藏管理員彩蛋區域，點擊右上角可觸發 */
        .admin-egg {
            position: fixed;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            z-index: 999;
            cursor: pointer;
            opacity: 0.4;
        }
        .admin-egg:hover {
            opacity: 0.8;
        }
        /* 1:1 正方形圖片的容器，使用 aspect-ratio 保持比例 */
        .img-square {
            aspect-ratio: 1 / 1;
            object-fit: cover;
            width: 100%;
            border-radius: 1rem;
            background: #f3f4f6;
        }
        /* 拍照按鈕樣式 */
        .photo-btn {
            transition: all 0.2s;
            border: 2px dashed #9ca3af;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background-color: #f9fafb;
            aspect-ratio: 1 / 1;
        }
        .photo-btn:hover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .photo-btn i {
            font-size: 2.5rem;
            color: #6b7280;
            margin-bottom: 0.5rem;
        }
        .photo-btn span {
            color: #6b7280;
            font-size: 0.875rem;
        }
        /* 投票卡片 */
        .vote-card {
            transition: all 0.2s;
            border-radius: 1rem;
            overflow: hidden;
            cursor: pointer;
            border: 4px solid transparent;
        }
        .vote-card.selected {
            border-color: #3b82f6;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }
        .vote-card:hover {
            transform: scale(1.02);
        }
        .countdown-text {
            font-variant-numeric: tabular-nums;
        }
        /* 管理員面板 */
        .admin-panel {
            transition: all 0.3s;
        }
        .hidden {
            display: none !important;
        }
        /* 圖片上傳中的 Loading */
        .upload-loading {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 1rem;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans antialiased">

    <!-- 隱藏管理員彩蛋 (右上角) -->
    <div id="adminEgg" class="admin-egg" title="管理員功能 (彩蛋)"></div>

    <!-- 主容器 -->
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-5 mt-6">
        <!-- 標題區 -->
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <i class="fas fa-camera-retro text-blue-500"></i> 拍照二選一
            </h1>
            <button id="shareBtn" class="text-gray-500 hover:text-blue-600 transition text-sm px-3 py-1 rounded-full border border-gray-200" title="分享連結">
                <i class="fas fa-share-alt"></i>
            </button>
        </div>

        <!-- 題目輸入 (建立模式) -->
        <div id="createMode">
            <div class="mb-3">
                <label class="block text-sm font-medium text-gray-700 mb-1">投票題目</label>
                <input type="text" id="pollTitle" placeholder="例如：午餐吃哪間？" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" value="午餐吃哪間？">
            </div>

            <!-- 兩張照片上傳區 -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <!-- A 選項 -->
                <div class="relative">
                    <div id="uploadA" class="photo-btn" onclick="triggerFileInput('A')">
                        <i class="fas fa-plus-circle"></i>
                        <span>上傳 A 照片</span>
                    </div>
                    <img id="previewA" class="img-square hidden" src="" alt="選項A">
                    <input type="file" id="fileInputA" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelected('A', event)">
                    <div id="loadingA" class="upload-loading hidden">
                        <i class="fas fa-spinner fa-spin text-blue-500 text-2xl"></i>
                    </div>
                </div>
                <!-- B 選項 -->
                <div class="relative">
                    <div id="uploadB" class="photo-btn" onclick="triggerFileInput('B')">
                        <i class="fas fa-plus-circle"></i>
                        <span>上傳 B 照片</span>
                    </div>
                    <img id="previewB" class="img-square hidden" src="" alt="選項B">
                    <input type="file" id="fileInputB" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelected('B', event)">
                    <div id="loadingB" class="upload-loading hidden">
                        <i class="fas fa-spinner fa-spin text-blue-500 text-2xl"></i>
                    </div>
                </div>
            </div>

            <!-- 截止時間設定 -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">截止時間</label>
                <input type="datetime-local" id="deadlineInput" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <!-- 建立投票按鈕 -->
            <button id="createPollBtn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 rounded-xl transition shadow-md disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                <i class="fas fa-check-circle mr-1"></i> 建立投票
            </button>
            <p id="createHint" class="text-xs text-gray-400 mt-2 text-center">請上傳兩張照片並設定截止時間</p>
        </div>

        <!-- 投票模式 (顯示題目、照片、倒數、投票按鈕) -->
        <div id="voteMode" class="hidden">
            <h2 id="displayTitle" class="text-lg font-bold text-gray-800 mb-3"></h2>
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div id="voteCardA" class="vote-card" onclick="vote('A')">
                    <img id="voteImgA" class="img-square" src="" alt="選項A">
                </div>
                <div id="voteCardB" class="vote-card" onclick="vote('B')">
                    <img id="voteImgB" class="img-square" src="" alt="選項B">
                </div>
            </div>
            <!-- 倒數計時 -->
            <div class="text-center mb-3">
                <span class="text-sm text-gray-500">距離截止</span>
                <div id="countdown" class="countdown-text text-2xl font-bold text-blue-600">--:--:--</div>
            </div>
            <!-- 票數顯示 -->
            <div class="flex justify-between text-sm text-gray-600 mb-2 px-1">
                <span>A: <span id="votesA" class="font-bold">0</span> 票</span>
                <span>B: <span id="votesB" class="font-bold">0</span> 票</span>
            </div>
            <!-- 投票按鈕 / 已投票提示 -->
            <div id="voteActionArea">
                <button id="voteBtnA" class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-xl transition shadow-md mb-2" onclick="vote('A')">投給 A</button>
                <button id="voteBtnB" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-semibold py-3 rounded-xl transition shadow-md" onclick="vote('B')">投給 B</button>
            </div>
            <div id="votedMessage" class="hidden text-center text-green-600 font-medium py-2">
                <i class="fas fa-check-circle"></i> 您已投票！
            </div>
            <div id="endedMessage" class="hidden text-center text-red-500 font-medium py-2">
                <i class="fas fa-lock"></i> 投票已結束
            </div>
        </div>
    </div>

    <!-- 管理員面板 (預設隱藏，點擊彩蛋顯示) -->
    <div id="adminPanel" class="admin-panel fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl">
            <h3 class="text-lg font-bold mb-4"><i class="fas fa-user-shield text-red-500 mr-2"></i>管理員功能</h3>
            <p class="text-sm text-gray-600 mb-4">提前結束投票並公布結果？</p>
            <div class="flex gap-3">
                <button id="adminCloseBtn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 rounded-lg transition">取消</button>
                <button id="adminEndBtn" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-semibold py-2 rounded-lg transition">結束投票</button>
            </div>
        </div>
    </div>

    <!-- 隱藏的管理員彩蛋點擊區域 (右上角已定義，此處再加強) -->
    <script>
        // ==================== 設定 GAS API URL ====================
        // 請將此處替換為您的 GAS Web App 部署 URL
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxXXXXXXXXXXXXXXXXXXXX/exec'; // 範例佔位符，需替換
        
        // ==================== 全局狀態 ====================
        let currentPollId = null;          // 當前投票 ID (從 URL 參數取得)
        let pollData = null;               // 投票資料 { title, imageA, imageB, votesA, votesB, deadline, status }
        let selectedVote = null;           // 本機選擇 (A/B)
        let hasVoted = false;              // 是否已投票 (本機紀錄)
        let countdownInterval = null;      // 倒數計時器
        let isAdminMode = false;           // 是否處於管理員模式 (用於顯示面板)
        
        // 圖片資料暫存 (建立模式)
        let imageDataA = null;             // { blob, previewUrl, uploadedUrl }
        let imageDataB = null;
        
        // 從 URL 取得 pollId
        function getPollIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('poll');
        }
        
        // ==================== 初始化 ====================
        window.addEventListener('DOMContentLoaded', () => {
            // 設定預設截止時間為 1 小時後
            const now = new Date();
            now.setHours(now.getHours() + 1);
            const isoLocal = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
            document.getElementById('deadlineInput').value = isoLocal;
            
            // 檢查 URL 是否有 poll 參數
            currentPollId = getPollIdFromUrl();
            
            if (currentPollId) {
                // 投票模式
                showVoteMode(currentPollId);
            } else {
                // 建立模式
                showCreateMode();
            }
            
            // 管理員彩蛋點擊
            document.getElementById('adminEgg').addEventListener('click', () => {
                if (currentPollId) {
                    // 只有投票模式才能使用管理員功能
                    document.getElementById('adminPanel').classList.remove('hidden');
                } else {
                    alert('請先建立或進入投票才能使用管理員功能');
                }
            });
            
            // 管理員面板按鈕
            document.getElementById('adminCloseBtn').addEventListener('click', () => {
                document.getElementById('adminPanel').classList.add('hidden');
            });
            document.getElementById('adminEndBtn').addEventListener('click', () => {
                endPollEarly();
            });
            
            // 建立投票按鈕
            document.getElementById('createPollBtn').addEventListener('click', createPoll);
            
            // 分享按鈕
            document.getElementById('shareBtn').addEventListener('click', sharePoll);
            
            // 監聽圖片上傳完成以更新按鈕狀態
            // 由 handleFileSelected 更新
        });
        
        // ==================== 顯示模式切換 ====================
        function showCreateMode() {
            document.getElementById('createMode').classList.remove('hidden');
            document.getElementById('voteMode').classList.add('hidden');
            document.getElementById('createHint').classList.remove('hidden');
        }
        
        function showVoteMode(pollId) {
            document.getElementById('createMode').classList.add('hidden');
            document.getElementById('voteMode').classList.remove('hidden');
            document.getElementById('createHint').classList.add('hidden');
            
            // 從 GAS 取得投票資料
            fetchPollData(pollId);
        }
        
        // ==================== 建立投票相關 ====================
        function triggerFileInput(option) {
            const input = document.getElementById(`fileInput${option}`);
            input.click();
        }
        
        // 處理選擇的檔案
        async function handleFileSelected(option, event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const loadingEl = document.getElementById(`loading${option}`);
            const previewEl = document.getElementById(`preview${option}`);
            const uploadBtn = document.getElementById(`upload${option}`);
            
            // 顯示 loading
            loadingEl.classList.remove('hidden');
            
            try {
                // 壓縮圖片 (Canvas 縮放至最大 800px)
                const compressedBlob = await compressImage(file, 800);
                
                // 產生預覽 URL (用於顯示)
                const previewUrl = URL.createObjectURL(compressedBlob);
                
                // 更新預覽圖
                previewEl.src = previewUrl;
                previewEl.classList.remove('hidden');
                uploadBtn.classList.add('hidden');
                
                // 儲存資料
                const imageData = {
                    blob: compressedBlob,
                    previewUrl: previewUrl,
                    uploadedUrl: null // 待上傳後取得
                };
                
                if (option === 'A') {
                    imageDataA = imageData;
                } else {
                    imageDataB = imageData;
                }
                
                // 更新建立按鈕狀態
                updateCreateButtonState();
                
            } catch (error) {
                console.error('圖片處理錯誤:', error);
                alert('圖片處理失敗，請重試');
                // 重置預覽
                previewEl.classList.add('hidden');
                uploadBtn.classList.remove('hidden');
            } finally {
                loadingEl.classList.add('hidden');
            }
        }
        
        // 壓縮圖片 (回傳 Blob)
        function compressImage(file, maxSize) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    
                    let { width, height } = img;
                    // 計算縮放比例
                    if (width > maxSize || height > maxSize) {
                        const ratio = Math.min(maxSize / width, maxSize / height);
                        width = Math.floor(width * ratio);
                        height = Math.floor(height * ratio);
                    }
                    
                    // 使用 Canvas 繪製
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // 轉成 Blob (JPEG, 0.8 品質)
                    canvas.toBlob((blob) => {
                        if (blob) {
                            resolve(blob);
                        } else {
                            reject(new Error('Canvas toBlob 失敗'));
                        }
                    }, 'image/jpeg', 0.8);
                };
                
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('圖片載入失敗'));
                };
                
                img.src = url;
            });
        }
        
        // 檢查是否兩張圖片都已上傳，更新建立按鈕
        function updateCreateButtonState() {
            const btn = document.getElementById('createPollBtn');
            const title = document.getElementById('pollTitle').value.trim();
            const deadline = document.getElementById('deadlineInput').value;
            
            // 圖片是否都已選擇 (預覽顯示中)
            const hasA = imageDataA !== null;
            const hasB = imageDataB !== null;
            
            if (hasA && hasB && title && deadline) {
                btn.disabled = false;
            } else {
                btn.disabled = true;
            }
        }
        
        // 建立投票
        async function createPoll() {
            const title = document.getElementById('pollTitle').value.trim();
            const deadline = document.getElementById('deadlineInput').value;
            
            if (!title || !deadline) {
                alert('請填寫題目與截止時間');
                return;
            }
            
            if (!imageDataA || !imageDataB) {
                alert('請上傳兩張照片');
                return;
            }
            
            const btn = document.getElementById('createPollBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> 建立中...';
            
            try {
                // 上傳圖片到 GAS (透過 FormData 或 Base64)
                // 簡化：將圖片轉為 Base64 並連同資料一起 POST
                const base64A = await blobToBase64(imageDataA.blob);
                const base64B = await blobToBase64(imageDataB.blob);
                
                const payload = {
                    action: 'createPoll',
                    title: title,
                    deadline: deadline,
                    imageA: base64A,
                    imageB: base64B
                };
                
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 成功建立，取得 pollId
                    const pollId = result.pollId;
                    // 導向投票頁面
                    window.location.href = `?poll=${pollId}`;
                } else {
                    alert('建立失敗: ' + (result.message || '未知錯誤'));
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> 建立投票';
                }
                
            } catch (error) {
                console.error('建立投票錯誤:', error);
                alert('網路錯誤，請重試');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> 建立投票';
            }
        }
        
        // 將 Blob 轉為 Base64 (不含 data: 前綴)
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }
        
        // ==================== 投票模式相關 ====================
        async function fetchPollData(pollId) {
            try {
                const response = await fetch(`${GAS_API_URL}?action=getPoll&pollId=${pollId}`);
                const data = await response.json();
                
                if (data.success) {
                    pollData = data.poll;
                    renderVoteMode();
                } else {
                    alert('找不到投票或載入失敗');
                    // 若失敗，可考慮顯示錯誤
                }
            } catch (error) {
                console.error('取得投票資料錯誤:', error);
                alert('網路錯誤，請重新整理');
            }
        }
        
        function renderVoteMode() {
            if (!pollData) return;
            
            document.getElementById('displayTitle').textContent = pollData.title;
            document.getElementById('voteImgA').src = pollData.imageA;
            document.getElementById('voteImgB').src = pollData.imageB;
            document.getElementById('votesA').textContent = pollData.votesA || 0;
            document.getElementById('votesB').textContent = pollData.votesB || 0;
            
            // 檢查是否已投票 (使用 localStorage 紀錄)
            const votedPolls = JSON.parse(localStorage.getItem('votedPolls') || '[]');
            hasVoted = votedPolls.includes(currentPollId);
            
            // 檢查是否已結束
            const now = new Date();
            const deadline = new Date(pollData.deadline);
            const isEnded = pollData.status === 'ended' || now > deadline;
            
            if (isEnded) {
                // 顯示已結束
                document.getElementById('voteActionArea').classList.add('hidden');
                document.getElementById('votedMessage').classList.add('hidden');
                document.getElementById('endedMessage').classList.remove('hidden');
                // 仍可顯示票數
            } else if (hasVoted) {
                // 顯示已投票
                document.getElementById('voteActionArea').classList.add('hidden');
                document.getElementById('votedMessage').classList.remove('hidden');
                document.getElementById('endedMessage').classList.add('hidden');
            } else {
                // 顯示投票按鈕
                document.getElementById('voteActionArea').classList.remove('hidden');
                document.getElementById('votedMessage').classList.add('hidden');
                document.getElementById('endedMessage').classList.add('hidden');
            }
            
            // 啟動倒數計時
            startCountdown(deadline);
        }
        
        // 啟動倒數計時
        function startCountdown(deadline) {
            if (countdownInterval) clearInterval(countdownInterval);
            
            const updateCountdown = () => {
                const now = new Date();
                const diff = deadline - now;
                
                if (diff <= 0) {
                    document.getElementById('countdown').textContent = '已截止';
                    // 如果尚未標示結束，重新載入資料或更新 UI
                    if (pollData.status !== 'ended') {
                        // 模擬結束
                        document.getElementById('voteActionArea').classList.add('hidden');
                        document.getElementById('endedMessage').classList.remove('hidden');
                        document.getElementById('votedMessage').classList.add('hidden');
                        pollData.status = 'ended';
                    }
                    clearInterval(countdownInterval);
                } else {
                    const hours = Math.floor(diff / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                    document.getElementById('countdown').textContent = 
                        `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }
            };
            
            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 1000);
        }
        
        // 投票動作 (從卡片或按鈕觸發)
        function vote(option) {
            if (hasVoted) {
                alert('您已經投過票了！');
                return;
            }
            
            const deadline = new Date(pollData.deadline);
            if (new Date() > deadline || pollData.status === 'ended') {
                alert('投票已截止');
                return;
            }
            
            // 送出投票
            submitVote(option);
        }
        
        async function submitVote(option) {
            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'vote',
                        pollId: currentPollId,
                        option: option
                    }),
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 更新本機紀錄
                    hasVoted = true;
                    const votedPolls = JSON.parse(localStorage.getItem('votedPolls') || '[]');
                    if (!votedPolls.includes(currentPollId)) {
                        votedPolls.push(currentPollId);
                        localStorage.setItem('votedPolls', JSON.stringify(votedPolls));
                    }
                    
                    // 更新 UI 票數
                    document.getElementById('votesA').textContent = result.votesA;
                    document.getElementById('votesB').textContent = result.votesB;
                    
                    // 隱藏投票按鈕，顯示已投票
                    document.getElementById('voteActionArea').classList.add('hidden');
                    document.getElementById('votedMessage').classList.remove('hidden');
                    
                    // 更新卡片選中狀態 (視覺回饋)
                    if (option === 'A') {
                        document.getElementById('voteCardA').classList.add('selected');
                    } else {
                        document.getElementById('voteCardB').classList.add('selected');
                    }
                } else {
                    alert('投票失敗: ' + (result.message || '未知錯誤'));
                }
            } catch (error) {
                console.error('投票錯誤:', error);
                alert('網路錯誤，請重試');
            }
        }
        
        // 管理員提前結束投票
        async function endPollEarly() {
            if (!currentPollId || !pollData) return;
            
            if (!confirm('確定要提前結束投票並公布結果嗎？')) return;
            
            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'endPoll',
                        pollId: currentPollId
                    }),
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 更新 UI
                    pollData.status = 'ended';
                    document.getElementById('voteActionArea').classList.add('hidden');
                    document.getElementById('endedMessage').classList.remove('hidden');
                    document.getElementById('votedMessage').classList.add('hidden');
                    
                    // 更新票數
                    document.getElementById('votesA').textContent = result.votesA;
                    document.getElementById('votesB').textContent = result.votesB;
                    
                    // 關閉管理員面板
                    document.getElementById('adminPanel').classList.add('hidden');
                    
                    // 清除倒數計時器
                    if (countdownInterval) clearInterval(countdownInterval);
                    document.getElementById('countdown').textContent = '已截止';
                } else {
                    alert('操作失敗: ' + (result.message || '未知錯誤'));
                }
            } catch (error) {
                console.error('結束投票錯誤:', error);
                alert('網路錯誤，請重試');
            }
        }
        
        // 分享連結
        function sharePoll() {
            if (currentPollId) {
                const shareUrl = `${window.location.origin}${window.location.pathname}?poll=${currentPollId}`;
                if (navigator.share) {
                    navigator.share({
                        title: '快來投票！',
                        text: pollData ? pollData.title : '拍照二選一',
                        url: shareUrl
                    }).catch(() => {
                        // 備用：複製到剪貼簿
                        copyToClipboard(shareUrl);
                    });
                } else {
                    copyToClipboard(shareUrl);
                }
            } else {
                alert('請先建立投票或進入投票頁面');
            }
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('連結已複製！');
            }).catch(() => {
                prompt('無法自動複製，請手動複製連結：', text);
            });
        }
        
        // 監聽題目輸入變更以更新建立按鈕 (因為是即時輸入)
        document.getElementById('pollTitle').addEventListener('input', updateCreateButtonState);
        document.getElementById('deadlineInput').addEventListener('change', updateCreateButtonState);
        
        // 頁面卸載時清除計時器
        window.addEventListener('beforeunload', () => {
            if (countdownInterval) clearInterval(countdownInterval);
        });
    </script>
</body>
</html>
